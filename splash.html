<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Life Insurance Awareness Month | Covered With Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --ink:#1A1A18;
  --gold:#9E8047;
  --gold2:#C4A96B;
  --white:#FFFFFF;
  --warm:#F5F2EC;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
}

html,body{
  width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 100%, #0d1117 0%, #070b10 50%, #020408 100%);
  overflow:hidden;
}

/* ── CANVAS (stars, wind, embers) ── */
#canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:1;
}

/* ── MAIN SPLASH ── */
.splash{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:10;
  padding:2rem;
}

/* Top ribbon */
.ribbon{
  font-family:var(--sans);
  font-size:0.78rem;
  font-weight:500;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:var(--gold2);
  margin-bottom:2.5rem;
  opacity:0;
  transform:translateY(-12px);
  animation:fadeUp 0.9s ease forwards 0.4s;
}

/* Month badge */
.month-badge{
  font-family:var(--sans);
  font-size:0.85rem;
  font-weight:400;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#D6BC8A;
  border:1px solid rgba(198,169,107,0.45);
  border-radius:30px;
  padding:0.5rem 1.4rem;
  margin-bottom:1.8rem;
  opacity:0;
  transform:translateY(-8px);
  animation:fadeUp 0.9s ease forwards 0.7s;
}

/* Main headline */
.headline{
  font-family:var(--serif);
  font-size:clamp(2.6rem,7vw,5.2rem);
  font-weight:300;
  color:var(--white);
  text-align:center;
  line-height:1.1;
  letter-spacing:-0.01em;
  max-width:760px;
  opacity:0;
  transform:translateY(16px);
  animation:fadeUp 1.1s ease forwards 1s;
}

.headline em{
  font-style:italic;
  color:var(--gold2);
}

/* Second line - reveals after the headline, same family, brighter for legibility */
.headline-2{
  font-family:var(--serif);
  font-size:clamp(1.9rem,5.2vw,3.2rem);
  font-weight:400;
  font-style:italic;
  color:#E8D3A3;
  text-align:center;
  line-height:1.25;
  letter-spacing:0.01em;
  max-width:680px;
  margin-top:1.2rem;
  opacity:0;
  transform:translateY(16px);
  animation:fadeUp 1.1s ease forwards 3.2s;
}

/* Gold divider line */
.divider{
  width:48px;height:1px;
  background:var(--gold);
  margin:2rem auto 0;
  opacity:0;
  transform:scaleX(0);
  animation:scaleIn 0.7s ease forwards 2.6s;
  transform-origin:center;
}

/* ── COUNTDOWN BAR ── */
.progress-wrap{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  padding:0 0 env(safe-area-inset-bottom,0);
}

.progress-bar{
  height:3px;
  background:rgba(158,128,71,0.2);
  position:relative;
  overflow:hidden;
}

.progress-fill{
  position:absolute;
  top:0;left:0;height:100%;
  width:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transform-origin:left;
  animation:countdown 10s linear forwards 0.5s;
}

/* Skip button */
.skip-wrap{
  position:fixed;
  bottom:2rem;right:1.5rem;
  z-index:30;
  opacity:0;
  animation:fadeUp 0.8s ease forwards 2.5s;
}

.skip{
  font-family:var(--sans);
  font-size:0.7rem;
  font-weight:400;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.35);
  background:none;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:30px;
  padding:0.5rem 1.1rem;
  cursor:pointer;
  transition:all 0.3s;
}
.skip:hover{
  color:var(--white);
  border-color:rgba(158,128,71,0.5);
  background:rgba(158,128,71,0.08);
}

/* ── LOGO ── */
.logo{
  position:fixed;
  top:1.5rem;left:50%;
  transform:translateX(-50%);
  z-index:20;
  text-align:center;
  opacity:0;
  animation:fadeIn 0.8s ease forwards 0.2s;
}
.logo-main{
  font-family:var(--serif);
  font-size:0.95rem;
  font-weight:400;
  color:var(--white);
  letter-spacing:0.04em;
}
.logo-sub{
  font-family:var(--sans);
  font-size:0.5rem;
  font-weight:500;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold);
  margin-top:2px;
}

/* ── YEAR ── */
.year{
  position:fixed;
  bottom:1.5rem;left:1.5rem;
  font-family:var(--sans);
  font-size:0.6rem;
  font-weight:300;
  letter-spacing:0.12em;
  color:rgba(255,255,255,0.2);
  z-index:20;
  opacity:0;
  animation:fadeIn 1s ease forwards 2s;
}

/* ── FADE OUT ── */
.splash.fade-out{
  animation:fadeOut 0.8s ease forwards;
}

/* ── KEYFRAMES ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes scaleIn{
  from{opacity:0;transform:scaleX(0);}
  to{opacity:1;transform:scaleX(1);}
}
@keyframes countdown{
  from{transform:scaleX(1);}
  to{transform:scaleX(0);}
}
@keyframes fadeOut{
  from{opacity:1;}
  to{opacity:0;}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important;}
}

@media(max-width:480px){
  .headline{font-size:2.2rem;}
  .sub{font-size:0.8rem;}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="logo">
  <div class="logo-main">Covered With Conditions</div>
  <div class="logo-sub">Life &nbsp;·&nbsp; Accident &nbsp;·&nbsp; Sickness</div>
</div>

<div class="splash" id="splash">
  <div class="ribbon">September · Life Insurance Awareness Month</div>
  <div class="month-badge">Honoring Every Life That Deserves Protection</div>
  <h1 class="headline">
    Protecting the lives<br>that matter most
  </h1>
  <div class="divider"></div>
  <p class="headline-2">
    Honoring those turned away elsewhere for complex health conditions, too
  </p>
</div>

<div class="progress-wrap">
  <div class="progress-bar">
    <div class="progress-fill" id="fill"></div>
  </div>
</div>

<div class="skip-wrap">
  <button class="skip" id="skipBtn" onclick="redirect()">Skip &nbsp;›</button>
</div>

<div class="year">2026</div>

<script>
// ── WINDY NIGHT SKY ──
(function(){
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var W, H;
  var stars = [];
  var embers = [];
  var clouds = [];
  var windTime = 0;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Wind strength oscillates like real gusts
  function wind(){
    return (Math.sin(windTime * 0.15) * 0.5 + Math.sin(windTime * 0.4) * 0.3 + 0.9);
  }

  // Stars - drift with the wind, twinkle, slight vertical sway
  function Star(){
    this.x = Math.random() * (W + 200) - 100;
    this.y = Math.random() * H * 0.78;
    this.r = Math.random() * 1.3 + 0.2;
    this.baseOpacity = Math.random() * 0.7 + 0.15;
    this.opacity = this.baseOpacity;
    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.depth = Math.random() * 0.8 + 0.2; // parallax: closer stars drift faster
    this.sway = Math.random() * Math.PI * 2;
    if(Math.random() < 0.05){ this.r = Math.random() * 2 + 1.2; this.baseOpacity = 0.9; }
  }

  // Thin, wind-blown mist streaks
  function Cloud(){
    this.x = Math.random() * (W + 400) - 200;
    this.y = Math.random() * H * 0.55;
    this.w = Math.random() * 260 + 140;
    this.h = Math.random() * 14 + 6;
    this.opacity = Math.random() * 0.05 + 0.02;
    this.depth = Math.random() * 0.6 + 0.3;
  }

  // Rising gold embers, pushed sideways by wind
  function Ember(){
    this.x = Math.random() * W;
    this.y = H + Math.random() * 100;
    this.r = Math.random() * 1.2 + 0.3;
    this.speed = Math.random() * 0.5 + 0.15;
    this.opacity = Math.random() * 0.4 + 0.1;
  }

  for(var i = 0; i < 190; i++) stars.push(new Star());
  for(var k = 0; k < 10; k++) clouds.push(new Cloud());
  for(var j = 0; j < 35; j++) embers.push(new Ember());

  function draw(){
    ctx.clearRect(0, 0, W, H);
    windTime += 0.016;
    var w = wind();

    // Drifting mist
    clouds.forEach(function(c){
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,190,210,' + c.opacity + ')';
      ctx.fill();
      c.x += w * c.depth * 0.6;
      if(c.x - c.w > W + 200){ c.x = -c.w - 200; c.y = Math.random() * H * 0.55; }
    });

    // Stars: twinkle + horizontal wind drift + gentle vertical sway
    stars.forEach(function(s){
      s.twinklePhase += s.twinkleSpeed;
      s.sway += 0.01;
      s.opacity = s.baseOpacity + Math.sin(s.twinklePhase) * (s.baseOpacity * 0.4);
      s.opacity = Math.max(0.05, Math.min(1, s.opacity));

      var drawX = s.x + Math.sin(s.sway) * 4;

      if(s.r > 1.2){
        var grd = ctx.createRadialGradient(drawX, s.y, 0, drawX, s.y, s.r * 4);
        grd.addColorStop(0, 'rgba(220,230,255,' + (s.opacity * 0.6) + ')');
        grd.addColorStop(1, 'rgba(220,230,255,0)');
        ctx.beginPath();
        ctx.arc(drawX, s.y, s.r * 4, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(drawX, s.y, s.r, 0, Math.PI * 2);
      var col = s.r > 1.2 ? '255,240,200' : '220,225,255';
      ctx.fillStyle = 'rgba(' + col + ',' + s.opacity + ')';
      ctx.fill();

      s.x += w * s.depth * 0.35;
      if(s.x > W + 100) s.x = -100;
      if(s.x < -100) s.x = W + 100;
    });

    // Rising embers, carried sideways by the same wind
    embers.forEach(function(e){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(158,128,71,' + e.opacity + ')';
      ctx.fill();
      e.y -= e.speed;
      e.x += w * 0.5;
      e.opacity *= 0.9995;
      if(e.y < -10 || e.opacity < 0.02){
        e.y = H + 10;
        e.x = Math.random() * W;
        e.opacity = Math.random() * 0.4 + 0.1;
      }
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── REDIRECT LOGIC ──
function getDestination(){
  var params = new URLSearchParams(window.location.search);
  var dest = params.get('to');
  if(dest){
    if(dest.startsWith('http') && dest.indexOf('coveredwithconditions.com') === -1){
      return 'index.html';
    }
    return dest;
  }
  var ref = document.referrer;
  if(ref && ref.indexOf('coveredwithconditions.com') > -1){
    var path = ref.replace(/https?:\/\/[^/]+\//, '');
    return path || 'index.html';
  }
  return 'index.html';
}

var destination = getDestination();
var redirected = false;

function redirect(){
  if(redirected) return;
  redirected = true;
  var splash = document.getElementById('splash');
  splash.classList.add('fade-out');
  setTimeout(function(){
    window.location.href = destination;
  }, 800);
}

setTimeout(redirect, 10500);
</script>
</body>
</html>
